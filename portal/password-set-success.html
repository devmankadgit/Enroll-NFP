<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Set Successfully | EnrollAxis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="portal.css">
<style>
  .p-auth-card { max-width: 440px; }
  .p-auth-logo { height: 28px; width: auto; margin: 0 auto 1.25rem; display: block; }
  .sp-success { text-align: center; }
  .sp-success-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 1rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.75rem;
    background: #e8f2f1;
    color: #177e71;
  }
  .sp-head { text-align: center; margin-bottom: 1.25rem; }
  .sp-head h1 {
    margin: 0 0 0.4rem;
    font-family: var(--p-font-heading);
    font-size: 1.35rem;
    font-weight: 700;
  }
  .sp-head p { margin: 0; color: var(--p-muted); font-size: 0.875rem; line-height: 1.5; }
</style>
</head>
<body>
  <div class="p-auth">
    <div class="p-auth-card">
      <img class="p-auth-logo" src="../assets/brand/enrollaxis-logo.png?v=2" alt="EnrollAxis">
      <div class="sp-success">
        <div class="sp-success-icon" aria-hidden="true"><i class="fas fa-check"></i></div>
        <div class="sp-head">
          <h1>Password set successfully</h1>
          <p>Your password has been set. You can now sign in to your Agent Portal.</p>
        </div>
        <a class="p-btn p-btn-block" href="sso-login.html?from=set-password" id="goLogin">Go to Login</a>
      </div>
    </div>
  </div>
  <script>
  (function () {
    try {
      var u = sessionStorage.getItem("eaPrefillUser");
      if (u) {
        var link = document.getElementById("goLogin");
        if (link) link.href = "sso-login.html?from=set-password&user=" + encodeURIComponent(u);
      }
    } catch (e) {}
  })();
  </script>
</body>
</html>
