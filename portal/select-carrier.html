<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a carrier | EnrollAxis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="p-auth">
    <div class="p-auth-card">
      <img class="p-auth-logo" src="../assets/brand/enrollaxis-logo.png?v=2" alt="EnrollAxis">

      <div id="chooseCarrier">
        <h1>Choose a carrier</h1>
        <p>Select the carrier you want to work in for this session.</p>
        <div class="p-carrier-list">
          <a class="p-btn p-btn-outline p-btn-block" href="select-portal.html">EnrollAxis Carrier 1</a>
          <a class="p-btn p-btn-outline p-btn-block" href="select-portal.html">EnrollAxis Carrier 2</a>
        </div>
      </div>

      <div id="noAccess" hidden>
        <h1>No access</h1>
        <p>Your account has no access to EnrollAxis yet. Ask your administrator to invite you.</p>
        <a class="p-btn p-btn-outline p-btn-block" href="../auth-carrier/login.html">Sign out</a>
      </div>
    </div>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    if (params.get('noaccess') === '1') {
      document.getElementById('chooseCarrier').hidden = true;
      document.getElementById('noAccess').hidden = false;
    }
  </script>
</body>
</html>
