<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log In | EnrollAxis</title>
<link rel="stylesheet" href="../assets/shadcn-ui.css?v=70">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<style>
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem 1.25rem 2rem;
    background:
      radial-gradient(ellipse 90% 70% at 50% 35%, var(--primary-50) 0%, transparent 62%),
      linear-gradient(180deg, #F7FBFA 0%, var(--neutral-50) 100%);
    font-family: var(--font-body);
    box-sizing: border-box;
  }

  .login-page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .login-card {
    background: var(--white);
    border-radius: 1rem;
    overflow: hidden;
    box-shadow:
      0 1px 2px color-mix(in srgb, var(--neutral-950) 4%, transparent),
      0 18px 40px color-mix(in srgb, var(--primary-900) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--primary-100) 70%, var(--border));
  }

  .login-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.15rem 1.35rem 1rem;
    background: linear-gradient(
      135deg,
      color-mix(in srgb, var(--primary-50) 88%, var(--white)) 0%,
      color-mix(in srgb, var(--secondary-50) 55%, var(--white)) 55%,
      color-mix(in srgb, var(--primary-50) 40%, var(--white)) 100%
    );
    border-bottom: 1px solid color-mix(in srgb, var(--primary-100) 65%, transparent);
  }

  .login-card-top .brand-logo {
    height: 34px;
    width: auto;
    max-width: 180px;
    object-fit: contain;
    object-position: left center;
  }

  .lang-select {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: transparent;
    color: var(--neutral-700);
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    padding: 0.25rem 0;
    line-height: 1.2;
  }
  .lang-select:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-500) 22%, transparent);
    border-radius: 4px;
  }
  .lang-wrap {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    color: var(--neutral-700);
    font-size: 0.875rem;
  }
  .lang-wrap i {
    font-size: 0.65rem;
    color: var(--neutral-500);
  }

  .login-card-body {
    padding: 1.5rem 1.5rem 1.75rem;
  }

  .login-card-body h1 {
    margin: 0 0 1.35rem;
    font-family: var(--font-heading);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--brand-ink);
    letter-spacing: -0.02em;
    line-height: 1.25;
  }

  .login-field {
    margin-bottom: 1rem;
  }
  .login-field .ui-label {
    font-family: var(--font-body);
    font-weight: 600;
    color: var(--neutral-800);
    margin-bottom: 0.4rem;
  }
  .login-field .ui-input-wrap .ui-input {
    padding-right: 2.75rem;
  }
  .login-field .ui-input-icon {
    color: var(--neutral-400);
  }

  .forgot-row {
    display: flex;
    justify-content: flex-end;
    margin: -0.15rem 0 1.15rem;
  }
  .forgot-row a {
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--primary-600);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .forgot-row a:hover {
    color: var(--primary-700);
  }

  .login-submit {
    width: 100%;
    height: 2.75rem;
    border: 0;
    border-radius: calc(var(--radius) - 2px);
    background: var(--primary-500);
    color: var(--white);
    font-family: var(--font-heading);
    font-size: 0.9375rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .login-submit:hover {
    background: var(--primary-600);
  }
  .login-submit:active {
    background: var(--primary-700);
  }
  .login-submit:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-500) 30%, transparent);
  }

  .powered-by {
    margin-top: 1.75rem;
    align-self: flex-end;
    text-align: right;
  }
  .powered-by .label {
    margin: 0 0 0.35rem;
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--neutral-500);
  }
  .powered-by img {
    height: 28px;
    width: auto;
    max-width: 160px;
    display: inline-block;
    object-fit: contain;
    object-position: right center;
  }

  @media (max-width: 480px) {
    .login-card-body {
      padding: 1.25rem 1.15rem 1.5rem;
    }
    .login-card-body h1 {
      font-size: 1.35rem;
    }
    .login-card-top {
      padding: 1rem 1.1rem 0.9rem;
    }
    .login-card-top .brand-logo {
      height: 30px;
    }
  }
</style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-card-top">
        <img class="brand-logo" src="../assets/brand/enrollaxis-logo.png?v=2" alt="EnrollAxis">
        <label class="lang-wrap" for="langSelect">
          <select class="lang-select" id="langSelect" aria-label="Language">
            <option selected>English</option>
          </select>
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </label>
      </div>

      <div class="login-card-body">
        <h1>Log In</h1>

        <div class="login-field ui-field">
          <label class="ui-label" for="username">Username</label>
          <div class="ui-input-wrap">
            <input class="ui-input" id="username" type="text" placeholder="Username" autocomplete="username">
            <span class="ui-input-icon" aria-hidden="true"><i class="far fa-user-circle"></i></span>
          </div>
        </div>

        <div class="login-field ui-field">
          <label class="ui-label" for="password">Password</label>
          <div class="ui-input-wrap">
            <input class="ui-input" id="password" type="password" placeholder="Password" autocomplete="current-password">
            <button type="button" class="ui-input-icon ui-clickable" id="togglePw" aria-label="Show password"><i class="fas fa-eye-slash"></i></button>
          </div>
        </div>

        <div class="forgot-row">
          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="button" class="login-submit" id="loginBtn">Log In</button>
      </div>
    </div>

    <div class="powered-by">
      <p class="label">Powered by</p>
      <img src="../assets/brand/aaneel-poweredby.png" alt="AaNeel">
    </div>
  </div>

  <script>
    document.getElementById('togglePw').addEventListener('click', function () {
      var input = document.getElementById('password');
      var icon = this.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye';
        this.setAttribute('aria-label', 'Hide password');
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye-slash';
        this.setAttribute('aria-label', 'Show password');
      }
    });

    document.getElementById('loginBtn').addEventListener('click', function () {
      window.location.href = '../agent/onboarding.html';
    });
  </script>
</body>
</html>
